buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = 'ValkyrienJS'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.saps.dev/minecraft' }
    maven { url = 'https://maven.architectury.dev/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly files("libs/valkyrienskies-120-2.4.11.jar")
    compileOnly files("libs/api-1.1.0+1d4a7373e9.jar")

    implementation fg.deobf(files("libs/valkyrienskies-120-2.4.11.jar"))
    implementation fg.deobf(files("libs/api-1.1.0+1d4a7373e9.jar"))

    implementation fg.deobf(files("libs/architectury-9.2.14-forge.jar"))
    implementation fg.deobf(files("libs/kubejs-forge-2001.6.5-build.16.jar"))
    implementation fg.deobf(files("libs/rhino-forge-2001.2.3-build.10.jar"))

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
    implementation 'org.joml:joml-primitives:1.10.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor files("libs/valkyrienskies-120-2.4.11.jar")
    annotationProcessor files("libs/api-1.1.0+1d4a7373e9.jar")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // Merge refmap with custom mappings for obfuscated Kotlin classes after resources are processed
    doLast {
        def refmapFile = file("build/tmp/compileJava/compileJava-refmap.json")
        if (refmapFile.exists()) {
            def refmap = new groovy.json.JsonSlurper().parse(refmapFile)

            // Add manual mappings for MixinFN (obfuscated Kotlin class)
            def mixinFNMappings = [
                "onPhysTickStart": "Lorg/valkyrienskies/core/impl/shadow/FN;a(DZ)Lorg/valkyrienskies/core/impl/shadow/FL;",
                "onGameFrameAdd": "Lorg/valkyrienskies/core/impl/shadow/FN;a(Lorg/valkyrienskies/core/impl/shadow/FG;)V"
            ]
            
            // Add manual mappings for MixinFH (physics frame queue handler)
            def mixinFHMappings = [
                "onPhysicsFrameProcess": "Lorg/valkyrienskies/core/impl/shadow/FH;a()V"
            ]

            if (!refmap.mappings) refmap.mappings = [:]
            if (!refmap.data) refmap.data = [:]
            if (!refmap.data.searge) refmap.data.searge = [:]

            refmap.mappings["dev/ignis/valkyrienjs/mixin/MixinFN"] = mixinFNMappings
            refmap.data.searge["dev/ignis/valkyrienjs/mixin/MixinFN"] = mixinFNMappings
            
            refmap.mappings["dev/ignis/valkyrienjs/mixin/MixinFH"] = mixinFHMappings
            refmap.data.searge["dev/ignis/valkyrienjs/mixin/MixinFH"] = mixinFHMappings

            def outputFile = file("build/resources/main/valkyrienjs.refmap.json")
            outputFile.parentFile.mkdirs()
            outputFile.text = groovy.json.JsonOutput.toJson(refmap)
            println "Merged refmap with MixinFN and MixinFH mappings"
        }
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
